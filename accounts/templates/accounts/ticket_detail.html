<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Reuse the same CSS styles from manage_students.html */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            min-height: 100vh;
        }
        .action-dropdown {
    position: relative;
}
.dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    top: 50px;
    background: white;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    padding: 10px;
    border-radius: 5px;
}
.action-dropdown:hover .dropdown-content {
    display: block;
}


        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #1e293b;
            color: #fff;
            height: 100vh;
            position: fixed;
            transition: all 0.3s;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #2c3e50;
        }

        .sidebar-logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .sidebar-menu {
            padding: 15px 0;
        }

        .sidebar-menu ul {
            list-style: none;
        }

        .sidebar-menu ul li {
            padding: 10px 25px;
            display: flex;
            align-items: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .sidebar-menu ul li:hover {
            background: #2c3e50;
            border-left: 4px solid #3498db;
        }

        .sidebar-menu ul li i {
            margin-right: 10px;
            font-size: 18px;
            width: 20px;
            text-align: center;
            color: white;
        }

        .sidebar-menu ul li span {
            font-size: 15px;
            color: white;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            margin-left: 250px;
            transition: all 0.3s;
        }

        /* Header */
        .header {
            background: #ffffff;
            height: 70px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 22px;
            font-weight: 600;
            color: #333;
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #e2e8f0;
        }

        .notification-badge {
            position: absolute;
            top: 0;
            right: 0;
            width: 18px;
            height: 18px;
            background: #e74c3c;
            color: #fff;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ticket Details Container */
        .ticket-details-container {
            padding: 20px;
        }

        .ticket-details-container h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        /* Ticket Messages */
        #ticket-messages {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #f1f5f9;
            max-width: 70%;
        }

        .user-message {
            margin-left: auto;
            background: #3498db;
            color: white;
        }

        .admin-message {
            margin-right: auto;
            background: #e2e8f0;
        }

        .message strong {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                overflow: hidden;
            }

            .sidebar-logo {
                font-size: 20px;
            }

            .sidebar-menu ul li span {
                display: none;
            }

            .main-content {
                margin-left: 70px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ADMIN</div>
        </div>
        <div class="sidebar-menu">
            <ul>
                <li><a href="{% url 'accounts:manage_students' %}"><i class="fas fa-users"></i><span>Manage Students</span></a></li>
                <li><a href="{% url 'accounts:manage_course_approvals' %}"><i class="fas fa-book"></i><span>Manage Courses</span></a></li>
                <li><a href="{% url 'accounts:admin_course_transfer_requests' %}"><i class="fas fa-exchange-alt"></i><span>Course Transfer</span></a></li>
                <li><a href="{% url 'accounts:manage_bookings' %}"><i class="fas fa-money-bill"></i><span>Manage Bookings</span></a></li>
                <li><a href="{% url 'accounts:admin_ticket_list' %}"><i class="fas fa-chart-bar"></i><span>Admin Tickets</span></a></li>
                <li><a href="{% url 'accounts:logout' %}"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
            </ul>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <div class="header-title">Ticket Details</div>
            <div class="header-actions">
                <div class="action-btn action-dropdown">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>

        <!-- Ticket Details Container -->
        <div class="ticket-details-container">
            <h2><i class="fas fa-ticket-alt"></i> Ticket Details</h2>
            <div id="ticket-messages">
                {% for response in ticket.responses.all %}
                <div class="message {% if response.responder == request.user %}user-message{% else %}admin-message{% endif %}">
                    <strong>{{ response.responder.username }}:</strong> {{ response.message }}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        // Auto-refresh ticket responses every second
        function fetchResponses() {
            fetch("{% url 'accounts:get_ticket_responses' ticket.id %}")
                .then(response => response.json())
                .then(data => {
                    let messagesContainer = document.getElementById("ticket-messages");
                    messagesContainer.innerHTML = "";
                    data.responses.forEach(resp => {
                        let div = document.createElement("div");
                        div.classList.add("message", resp.responder__username === "{{ request.user.username }}" ? "user-message" : "admin-message");
                        div.innerHTML = `<strong>${resp.responder__username}:</strong> ${resp.message}`;
                        messagesContainer.appendChild(div);
                    });
                });
        }
        setInterval(fetchResponses, 1000);
    </script>
</body>
</html>
